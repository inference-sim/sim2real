# Namespace-scoped permissions the orchestrator SA needs in each slot ns:
# - pipelineruns (tekton.dev): create/manage workload PipelineRuns.
# - persistentvolumeclaims: slot-readiness checks (PVC bound state).
# - secrets: credential existence check before Tekton run dispatch.
#   The orchestrator calls `kubectl get secret <name>` to verify the
#   HuggingFace token, registry-creds, and metrics-reader secrets exist
#   before submitting a PipelineRun.  The resourceNames list covers the
#   four default secret names (pipeline/cluster.py:_DEFAULT_SECRET_NAMES)
#   plus the metrics-reader secret. Operators who rename secrets at
#   cluster-init time must update this list after applying the Role.
#
# - pods: per-PipelineRun pending-pod triage (deploy.py _check_pending_pods)
#   and broader non-Tekton pod health sweeps (lib/health.py:get_all_pods).
# - events: triage context for pending/failed pods
#   (lib/health.py:get_events) — feeds the pod_pending classifier.
# Granted here rather than via the cluster bundle so the orchestrator
# works when the operator running setup.py lacks cluster-RBAC privileges
# (sim2real-runner-cluster.yaml is best-effort and silently skipped in
# that case — issue #410).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sim2real-runner-ns
  namespace: ${NAMESPACE}
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "get", "watch", "list", "delete", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    # Restrict to only the credential secrets the orchestrator actually reads.
    # Default secret names come from pipeline/cluster.py:_DEFAULT_SECRET_NAMES.
    # Update this list if you rename secrets at cluster-init time.
    resourceNames:
      - hf-secret
      - registry-creds
      - dockerhub-creds
      - inference-gateway-sa-metrics-reader-secret
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sim2real-runner-ns
  namespace: ${NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: sim2real-runner
    namespace: ${PRIMARY_NAMESPACE}
roleRef:
  kind: Role
  name: sim2real-runner-ns
  apiGroup: rbac.authorization.k8s.io
