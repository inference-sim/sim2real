apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: sim2real
spec:
  params:
    - name: experimentId
      type: string
    - name: runName
      type: string
    - name: namespace
      type: string
    - name: phase
      type: string
    - name: scenarioContent
      type: string
    - name: specContent
      type: string
    - name: workloadName
      type: string
    - name: workloadSpec
      type: string
    - name: observeArgs
      type: string
      description: >-
        The complete `blis observe` argv except --server-url, rendered by
        assemble (pipeline/lib/observe_argv.py, issue #900). Consumed by
        run-workload-blis-observe-binary, which appends --server-url and runs
        it. No default: an unrendered PipelineRun must fail at creation rather
        than reach blis with an empty command line.
    - name: benchmarkGitRepoUrl
      type: string
    - name: benchmarkGitCommit
      type: string
    - name: blisGitRepoUrl
      type: string
    - name: blisGitCommit
      type: string
    - name: skipTeardown
      type: string
      default: "false"
    - name: replica
      type: string
      default: "1"
    - name: traceSpec
      type: string
      default: ""
    - name: tracePath
      type: string
      default: ""
    - name: traceSource
      type: string
      default: ""
    # Optional HF dataset revision. Empty resolves the repo's default branch.
    - name: traceRevision
      type: string
      default: ""
    # Upstream corpus format; selects the whole fetch/build/convert chain.
    # Empty lets the Task apply its own otel-parquet default, which is what a
    # PipelineRun generated before #905 relies on.
    - name: traceFormat
      type: string
      default: ""
    - name: traceShards
      type: string
      default: ""
    - name: traceMinRounds
      type: string
      default: ""
    - name: traceSplit
      type: string
      default: ""
    - name: traceContextGrowth
      type: string
      default: ""
    # Cap on the per-round client think gap, as a Go duration string. Empty
    # OMITS --max-think-time so each converter keeps its own default, which
    # differ (otel 15s, weka none) — assemble always sends an explicit value.
    - name: traceMaxThinkTime
      type: string
      default: ""
    - name: traceDedupByConversation
      type: string
      default: ""
    - name: traceShuffleSeed
      type: string
      default: ""
  workspaces:
    - name: source
    - name: data-storage
  tasks:
    - name: install-llmdbenchmark
      retries: 2
      taskRef:
        name: install-llmdbenchmark
      workspaces:
        - name: source
          workspace: source
      params:
        - name: git_repo_url
          value: "$(params.benchmarkGitRepoUrl)"
        - name: git_commit
          value: "$(params.benchmarkGitCommit)"

    - name: install-blis
      taskRef:
        name: install-blis
      workspaces:
        - name: source
          workspace: source
      params:
        - name: git_repo_url
          value: "$(params.blisGitRepoUrl)"
        - name: git_commit
          value: "$(params.blisGitCommit)"

    - name: prepare-trace
      runAfter: ["install-blis"]
      taskRef:
        name: prepare-trace
      workspaces:
        - name: source
          workspace: source
        - name: data
          workspace: data-storage
      params:
        - name: traceSpec
          value: "$(params.traceSpec)"
        - name: tracePath
          value: "$(params.tracePath)"
        - name: traceSource
          value: "$(params.traceSource)"
        - name: traceRevision
          value: "$(params.traceRevision)"
        - name: traceFormat
          value: "$(params.traceFormat)"
        - name: traceShards
          value: "$(params.traceShards)"
        - name: traceMinRounds
          value: "$(params.traceMinRounds)"
        - name: traceSplit
          value: "$(params.traceSplit)"
        - name: traceContextGrowth
          value: "$(params.traceContextGrowth)"
        - name: traceMaxThinkTime
          value: "$(params.traceMaxThinkTime)"
        - name: traceDedupByConversation
          value: "$(params.traceDedupByConversation)"
        - name: traceShuffleSeed
          value: "$(params.traceShuffleSeed)"

    - name: llmdbenchmark-standup
      runAfter: ["install-llmdbenchmark"]
      taskRef:
        name: llmdbenchmark-standup
      workspaces:
        - name: source
          workspace: source
        - name: data
          workspace: data-storage
      params:
        - name: namespace
          value: "$(params.namespace)"
        - name: scenario_content
          value: "$(params.scenarioContent)"
        - name: spec_content
          value: "$(params.specContent)"
        - name: plans_dir
          value: "$(params.runName)/plans/$(params.phase)/$(params.workloadName)"
        - name: smoketest_delay
          value: "30"

    - name: prepare-results-dir
      taskRef:
        name: prepare-results-dir
      workspaces:
        - name: data
          workspace: data-storage
      params:
        - name: resultsDir
          value: "$(params.runName)/$(params.phase)/$(params.workloadName)/i$(params.replica)"

    - name: stream-epp-logs
      runAfter: ["llmdbenchmark-standup", "prepare-results-dir", "prepare-trace"]
      taskRef:
        name: stream-epp-logs
      workspaces:
        - name: data
          workspace: data-storage
      params:
        - name: namespace
          value: "$(params.namespace)"
        - name: resultsDir
          value: "$(params.runName)/$(params.phase)/$(params.workloadName)/i$(params.replica)"

    - name: stream-gpu-stats
      runAfter: ["llmdbenchmark-standup", "prepare-results-dir", "prepare-trace"]
      taskRef:
        name: stream-gpu-stats
      workspaces:
        - name: data
          workspace: data-storage
      params:
        - name: namespace
          value: "$(params.namespace)"
        - name: resultsDir
          value: "$(params.runName)/$(params.phase)/$(params.workloadName)/i$(params.replica)"

    - name: stream-metrics
      runAfter: ["llmdbenchmark-standup", "prepare-results-dir", "prepare-trace"]
      taskRef:
        name: stream-metrics
      workspaces:
        - name: data
          workspace: data-storage
      params:
        - name: namespace
          value: "$(params.namespace)"
        - name: resultsDir
          value: "$(params.runName)/$(params.phase)/$(params.workloadName)/i$(params.replica)"
        # Pin collect_metrics.sh + process_metrics.py to the SHA sim2real
        # currently vendors in its llm-d-benchmark submodule. The value
        # flows in from the pipeline-level ``benchmarkGitCommit`` param,
        # which ``sim2real assemble`` fills from
        # ``discover_framework_submodules()['llm-d-benchmark']`` on every
        # PipelineRun (see pipeline/lib/assemble_run.py). Same rail
        # install-llmdbenchmark rides above at line ~69 — bumping the
        # submodule pointer automatically re-pins the scraper without a
        # manual edit here.
        - name: harnessSha
          value: "$(params.benchmarkGitCommit)"

    - name: run-workload-blis-observe-binary
      runAfter: ["llmdbenchmark-standup", "install-blis", "prepare-results-dir", "prepare-trace"]
      taskRef:
        name: run-workload-blis-observe-binary
      workspaces:
        - name: source
          workspace: source
        - name: data
          workspace: data-storage
      params:
        - name: endpoint
          value: "$(tasks.llmdbenchmark-standup.results.endpoint)"
        - name: observeArgs
          value: "$(params.observeArgs)"
        - name: workloadSpec
          value: "$(params.workloadSpec)"
        - name: resultsDir
          value: "$(params.runName)/$(params.phase)/$(params.workloadName)/i$(params.replica)"

    - name: collect-results
      runAfter: ["run-workload-blis-observe-binary"]
      taskRef:
        name: collect-results
      workspaces:
        - name: data
          workspace: data-storage
      params:
        - name: resultsDir
          value: "$(params.runName)/$(params.phase)/$(params.workloadName)/i$(params.replica)"
        - name: namespace
          value: "$(params.namespace)"

  finally:
    - name: llmdbenchmark-teardown
      when:
        - input: "$(params.skipTeardown)"
          operator: notin
          values: ["true"]
      taskRef:
        name: llmdbenchmark-teardown
      workspaces:
        - name: source
          workspace: source
      params:
        - name: namespace
          value: "$(params.namespace)"
        - name: scenario_content
          value: "$(params.scenarioContent)"
        - name: spec_content
          value: "$(params.specContent)"
