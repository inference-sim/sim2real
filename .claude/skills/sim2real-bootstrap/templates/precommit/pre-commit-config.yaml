# Secret-scan pre-commit hook, scaffolded by /sim2real-bootstrap (issue #822).
#
# This is the second layer behind sim2real's collect-time redactor
# (pipeline/lib/redact.py, issue #819): the redactor knows what the pipeline
# WRITES; this hook knows what is about to be COMMITTED. Different inputs,
# different blind spots. Experiment repos track their workspace/ tree, so a
# credential the redactor misses (a new key name, a hand-copied results tree,
# a stray .env / kubeconfig) would otherwise land in public git history the
# moment it is committed.
#
# The scan is whole-repo and blocking: detect-secrets fails the commit on any
# unaudited finding. To activate it in a fresh clone:
#
#     pip install pre-commit detect-secrets
#     pre-commit install
#
# Escape hatch for a known-clean commit the scanner false-positives on:
#     git commit --no-verify
# (prefer auditing the finding into .secrets.baseline over routine --no-verify)
#
# Retrofitting an already-committed repo: rotate/scrub any real secrets FIRST,
# then regenerate the baseline over the cleaned tree:
#     detect-secrets scan --baseline .secrets.baseline
# Do NOT regenerate the baseline over a tree that still contains live tokens —
# that audits the secret as "known" and permanently whitelists it.
repos:
  - repo: https://github.com/ibm/detect-secrets
    # Pinned to match the shipped .secrets.baseline `version`. `pre-commit
    # autoupdate` bumps this to the latest tag; regenerate the baseline if
    # you do. Matches the ref used by llm-d-benchmark for consistency.
    rev: 0.13.1+ibm.64.dss
    hooks:
      - id: detect-secrets # pragma: whitelist secret
        # --use-all-plugins: run every detector, not just those recorded in
        # the baseline, so new secret shapes are caught without editing this
        # file. --baseline: audited known-safe hits live in .secrets.baseline.
        #
        # .secrets.baseline also tunes Base64HighEntropyString base64_limit to
        # 4.25 (down from the 4.5 default). The HF token from issue #819 has
        # Shannon entropy 4.391 — it slips past the default limit, but its
        # base64-encoded twin (tokenBase64, 4.546) does not; 4.25 catches both
        # representations. On the real leaked 933-line plan config, 4.25 added
        # zero false positives (4.0 flagged file paths / namespaces). The hook
        # honors this limit even under --use-all-plugins.
        #
        # --exclude-lines drops content-hash lines by FIELD NAME (issue #865).
        # The bundle format is built out of SHA-256 hex, whose Shannon entropy
        # (~3.9) is above HexHighEntropyString's hex_limit of 3, so every hash
        # the pipeline writes trips the detector: translation_hash and
        # source_sha256 in translations/<hash>/{skill_input,translation_output}
        # .json, package_manifest_sha256 / runner_go_sha256 /
        # package_manifest_short in translate review rounds, "hash" in
        # sim_results/ sample manifests, and the git sha under transfer.yaml's
        # component `ref:`. Neither printed mitigation works on those: JSON has
        # no comments so `pragma: allowlist secret` is impossible, and the
        # baseline keys on (filename, line_number, hashed_secret), all of which
        # change every translation — so auditing strands the old entries and
        # fails again next run. Left unfixed, the operator commits with
        # --no-verify as a matter of routine, which disables the whole scan.
        #
        # Keyed on the field name rather than on the file so those same files
        # stay scanned for the paths, env, and config they also carry — that
        # breadth is the #822 rationale for a whole-repo hook over the
        # collect-time redactor, and excluding workspace/translations/**
        # wholesale would give it back. The key must END in one of the listed
        # words, so `hashicorp_vault_token:` and `refresh_token:` keep being
        # scanned; `ref|commit|revision` is dropped only when the value is a
        # bare 7-64 char git sha, so `ref: refs/heads/main` and any opaque
        # token under `ref:` keep being scanned too.
        #
        # KNOWN COST: a credential parked under a key ending in
        # hash/digest/checksum/sha*/fingerprint would slip past the hook.
        # Accepted because those names denote content-addressed values by
        # convention, and the alternative is habitual --no-verify. If that is
        # too broad for your repo, replace the word family with the exact
        # field names your pipeline emits — at the cost of editing this file
        # each time an output schema gains a hash field.
        #
        # DO NOT "simplify" this to the baseline's own `exclude.lines`: the
        # hook does not honor that key, so dropping the arg restores every
        # false positive. The baseline carries the same regex anyway, so that
        # a later `detect-secrets scan --baseline .secrets.baseline`
        # regeneration agrees with the hook instead of silently re-finding
        # what the hook skips. Keep the two in sync — a test asserts they are
        # byte-identical.
        # --word-list suppresses Kubernetes object names (issue #896).
        #
        # Pod and ReplicaSet names are high-entropy BY CONSTRUCTION. The
        # Base64HighEntropyString charset includes `-` and `_` (url-safe
        # base64), so a name like
        #   meta-lla-888e33f1-instruct-decode-558d9f5fd4-x97w2-rank-0
        # is one candidate token at Shannon entropy 4.447 — ABOVE the 4.391 HF
        # token the 4.25 limit exists to catch. No threshold separates them, so
        # tuning the limit cannot work, in either direction.
        #
        # In `resources/` manifests these appear as bare `name:` scalars.
        # detect-secrets tries _analyze_yaml_file BEFORE the plain line scan
        # and that path inspects parsed string VALUES, so source quoting is
        # irrelevant — unquoted names are candidates in YAML even though the
        # same text in a .log file would not be.
        #
        # Why the other three mechanisms were each rejected:
        #   - the entropy limit: see above, no threshold works.
        #   - the baseline: names carry a ReplicaSet hash and a random 5-char
        #     suffix that change on every deployment, so each run strands the
        #     previous entries — the #865 failure mode exactly.
        #   - --exclude-lines: the only keyable field is `name:`, and exempting
        #     every `name:` line in every YAML repo-wide is far too broad a
        #     trade for this.
        #
        # The word list keys on the ROLE segments llm-d-modelservice appends,
        # NOT on the deployment-name prefix: that prefix is model.shortName
        # truncated plus a hash, derived per bundle, so the scaffold cannot
        # know it. The role segments are model-agnostic and identical for
        # every bundle, so they ship as a constant.
        #
        # Suppression is per-SECRET, not per-line or per-file:
        # is_found_with_aho_corasick drops a candidate when the candidate
        # CONTAINS a listed word, so the rest of every manifest stays scanned.
        #
        # .secrets.wordlist must stay COMMENT-FREE. build_automaton adds every
        # line longer than 3 characters verbatim and has no comment syntax, so
        # a `#` line would be loaded as a suppression word. That is why this
        # explanation lives here and not in the wordlist file.
        #
        # KNOWN GAP: the fragments cover modelservice role pods. The harness's
        # own pods (download-model-*, sim2real-orchestrator-*) sit at 3.9-4.1
        # today and so are not flagged, but a longer model prefix could push
        # one over. Add one more fragment if that happens.
        args:
          - --baseline
          - .secrets.baseline
          - --use-all-plugins
          - --exclude-lines
          - '(?i)(?:^[\s"-]*[a-z0-9_.]*(?:sha1|sha256|sha512|hash|digest|checksum|fingerprint|manifest_short)"?\s*[:=])|(?:^\s*-?\s*"?(?:ref|commit|revision)"?\s*[:=]\s*"?[0-9a-f]{7,64}"?\s*,?\s*(?:#.*)?$)'
          - --word-list
          - .secrets.wordlist
        # --word-list needs pyahocorasick, which is NOT in the hook's default
        # environment (ModuleNotFoundError without this). No baseline
        # regeneration is needed to add it: pre_commit_hook.py builds the
        # automaton and hands it to the plugins without ever comparing the
        # baseline's recorded word_list.hash, so `word_list: {file: null,
        # hash: null}` in the shipped baseline stays valid.
        additional_dependencies:
          - pyahocorasick
        # Excluded from the scan:
        #
        #   .secrets.baseline — records hashes of audited hits; scanning it
        #   would be circular.
        #
        #   the four collected-telemetry trees under workspace/runs/ — these
        #   are machine-generated and carry Kubernetes pod names in bulk
        #   (Prometheus label values in metrics/raw/*, zap JSON values in
        #   epp_logs/*). The word list above handles the handful of names in
        #   `resources/` manifests; it is the wrong tool for whole trees, where
        #   the volume is the problem: 4,234 of 4,682 staged files on one run,
        #   epp_logs/ alone 3.1 GB of 3.7 GB.
        #
        # The principle is SCAN WHAT A HUMAN OR A TEMPLATE AUTHORED; SKIP
        # MACHINE-GENERATED TELEMETRY. Anchored to workspace/runs/ so a
        # metrics/ directory elsewhere in a bundle stays in scope. Deliberately
        # still scanned, and where the credential risk actually is:
        # resources/ manifests (env, secretKeyRef, ConfigMaps),
        # manifest.assembly.yaml, run_metadata.json, trace_header.yaml, the
        # generated plugin configs, baselines/, transfer.yaml and config.md.
        #
        # STANDING EXEMPTION, not a one-time judgement: these trees are not
        # redacted at collect time either — redact_yaml_tree walks resources/
        # only — so after this exclusion they have NO secret-scanning layer at
        # all. What was actually checked before accepting that trade, on one
        # run: epp_logs/ across all 165 files had zero hits for authorization,
        # bearer, x-api-key, apikey or hf_ (every "token" match was a metric
        # field name such as KvCacheMaxTokenCapacity); server_logs/ and
        # gpu_logs/ were checked over a ~200-file subset for token/key/AWS/
        # private-key shapes with zero hits. metrics/ was NOT scanned for
        # credential shapes. So this is "no evidence of credentials in the
        # sampled corpus", NOT "verified clean". Closing the gap properly means
        # extending the collect-time redactor to logs — a separate change.
        #
        # NOTE ON LAYERS: this `exclude:` is a pre-commit key, applied by
        # pre-commit to the file list BEFORE the hook runs. It is not a hook
        # argument, and neither the hook nor the baseline's own `exclude.files`
        # suppresses these findings when detect-secrets-hook is invoked
        # directly on an explicit path. The baseline carries the same regex so
        # a later `detect-secrets scan --baseline .secrets.baseline`
        # regeneration agrees with the hook; a test asserts the two match.
        exclude: '^(\.secrets\.baseline$|workspace/runs/.*/(epp_logs|gpu_logs|metrics|server_logs)/)'
