# Secret-scan pre-commit hook, scaffolded by /sim2real-bootstrap (issue #822).
#
# This is the second layer behind sim2real's collect-time redactor
# (pipeline/lib/redact.py, issue #819): the redactor knows what the pipeline
# WRITES; this hook knows what is about to be COMMITTED. Different inputs,
# different blind spots. Experiment repos track their workspace/ tree, so a
# credential the redactor misses (a new key name, a hand-copied results tree,
# a stray .env / kubeconfig) would otherwise land in public git history the
# moment it is committed.
#
# The scan is whole-repo and blocking: detect-secrets fails the commit on any
# unaudited finding. To activate it in a fresh clone:
#
#     pip install pre-commit detect-secrets
#     pre-commit install
#
# Escape hatch for a known-clean commit the scanner false-positives on:
#     git commit --no-verify
# (prefer auditing the finding into .secrets.baseline over routine --no-verify)
#
# Retrofitting an already-committed repo: rotate/scrub any real secrets FIRST,
# then regenerate the baseline over the cleaned tree:
#     detect-secrets scan --baseline .secrets.baseline
# Do NOT regenerate the baseline over a tree that still contains live tokens —
# that audits the secret as "known" and permanently whitelists it.
repos:
  - repo: https://github.com/ibm/detect-secrets
    # Pinned to match the shipped .secrets.baseline `version`. `pre-commit
    # autoupdate` bumps this to the latest tag; regenerate the baseline if
    # you do. Matches the ref used by llm-d-benchmark for consistency.
    rev: 0.13.1+ibm.64.dss
    hooks:
      - id: detect-secrets # pragma: whitelist secret
        # --use-all-plugins: run every detector, not just those recorded in
        # the baseline, so new secret shapes are caught without editing this
        # file. --baseline: audited known-safe hits live in .secrets.baseline.
        #
        # .secrets.baseline also tunes Base64HighEntropyString base64_limit to
        # 4.25 (down from the 4.5 default). The HF token from issue #819 has
        # Shannon entropy 4.391 — it slips past the default limit, but its
        # base64-encoded twin (tokenBase64, 4.546) does not; 4.25 catches both
        # representations. On the real leaked 933-line plan config, 4.25 added
        # zero false positives (4.0 flagged file paths / namespaces). The hook
        # honors this limit even under --use-all-plugins.
        #
        # --exclude-lines drops content-hash lines by FIELD NAME (issue #865).
        # The bundle format is built out of SHA-256 hex, whose Shannon entropy
        # (~3.9) is above HexHighEntropyString's hex_limit of 3, so every hash
        # the pipeline writes trips the detector: translation_hash and
        # source_sha256 in translations/<hash>/{skill_input,translation_output}
        # .json, package_manifest_sha256 / runner_go_sha256 /
        # package_manifest_short in translate review rounds, "hash" in
        # sim_results/ sample manifests, and the git sha under transfer.yaml's
        # component `ref:`. Neither printed mitigation works on those: JSON has
        # no comments so `pragma: allowlist secret` is impossible, and the
        # baseline keys on (filename, line_number, hashed_secret), all of which
        # change every translation — so auditing strands the old entries and
        # fails again next run. Left unfixed, the operator commits with
        # --no-verify as a matter of routine, which disables the whole scan.
        #
        # Keyed on the field name rather than on the file so those same files
        # stay scanned for the paths, env, and config they also carry — that
        # breadth is the #822 rationale for a whole-repo hook over the
        # collect-time redactor, and excluding workspace/translations/**
        # wholesale would give it back. The key must END in one of the listed
        # words, so `hashicorp_vault_token:` and `refresh_token:` keep being
        # scanned; `ref|commit|revision` is dropped only when the value is a
        # bare 7-64 char git sha, so `ref: refs/heads/main` and any opaque
        # token under `ref:` keep being scanned too.
        #
        # KNOWN COST: a credential parked under a key ending in
        # hash/digest/checksum/sha*/fingerprint would slip past the hook.
        # Accepted because those names denote content-addressed values by
        # convention, and the alternative is habitual --no-verify. If that is
        # too broad for your repo, replace the word family with the exact
        # field names your pipeline emits — at the cost of editing this file
        # each time an output schema gains a hash field.
        #
        # DO NOT "simplify" this to the baseline's own `exclude.lines`: the
        # hook does not honor that key, so dropping the arg restores every
        # false positive. The baseline carries the same regex anyway, so that
        # a later `detect-secrets scan --baseline .secrets.baseline`
        # regeneration agrees with the hook instead of silently re-finding
        # what the hook skips. Keep the two in sync — a test asserts they are
        # byte-identical.
        args:
          - --baseline
          - .secrets.baseline
          - --use-all-plugins
          - --exclude-lines
          - '(?i)(?:^[\s"-]*[a-z0-9_.]*(?:sha1|sha256|sha512|hash|digest|checksum|fingerprint|manifest_short)"?\s*[:=])|(?:^\s*-?\s*"?(?:ref|commit|revision)"?\s*[:=]\s*"?[0-9a-f]{7,64}"?\s*,?\s*(?:#.*)?$)'
        # The baseline file records hashes of audited hits; scanning it would
        # be circular. Everything else in the repo is in scope.
        exclude: ^\.secrets\.baseline$
