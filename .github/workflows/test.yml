name: Transfer Pipeline Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest pytest-cov ruff -r requirements.txt

      - name: Lint
        run: ruff check pipeline/ .claude/skills/ --select F

      - name: Run tests
        run: |
          python -m pytest pipeline/ \
            .claude/skills/sim2real-analyze/tests/ \
            .claude/skills/sim2real-bootstrap/tests/ \
            .claude/skills/sim2real-translate/tests/ \
            .claude/skills/sim2real-check/tests/ \
            --cov=pipeline \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            -v
