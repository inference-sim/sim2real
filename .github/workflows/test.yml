name: Transfer Pipeline Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Report both legs independently: a floor failure and a ceiling failure
      # have different causes, and we want to see both rather than whichever
      # tripped first.
      fail-fast: false
      matrix:
        # Floor and ceiling. The floor must equal pyproject.toml's
        # requires-python — pipeline/tests/test_python_version.py asserts that
        # the lowest leg here and MIN_PYTHON agree, so a floor nobody tests
        # cannot quietly stop being true (#906).
        python-version: ["3.12", "3.14"]
    env:
      CI: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false

      # Shallow-init ONLY inference-sim, whose cmd/ package the observe
      # flag-list guard reads (#900). `submodules: false` above stays: the other
      # submodules are large and no test needs them.
      #
      # Without this the guard is worse than absent. Its three tests skip on a
      # missing submodule, so the checks whose entire stated purpose is "a future
      # pin bump that renames an observe flag fails here instead of in a pod"
      # would be SKIPPED in exactly the gate meant to catch it — which is how
      # #904 shipped a pin bump past inference-sim #1516's --post-hoc-detector
      # rename and broke every observe run with nothing noticing.
      #
      # Same reasoning as the pinned detect-secrets install below: make the
      # behavioral tests executable in the merge gate rather than skipped.
      - name: Shallow-init inference-sim (observe flag-list guard)
        run: git submodule update --init --depth 1 inference-sim

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov ruff -r requirements.txt
          # Pinned to the same rev the scaffolded .secrets.baseline / config use,
          # so the sim2real-bootstrap behavioral secret-scan tests (#822) run
          # under the merge gate instead of skipping. Verified to install and run
          # on both CI Pythons (3.12 and 3.14).
          pip install "detect-secrets @ git+https://github.com/ibm/detect-secrets.git@0.13.1+ibm.64.dss"
          # detect-secrets' --word-list (#896) imports pyahocorasick lazily and
          # raises ModuleNotFoundError without it. The scaffolded hook declares
          # it via additional_dependencies, but that only covers pre-commit's
          # managed env — the behavioral tests invoke detect-secrets-hook
          # directly, so it must be installed here too or the word-list tests
          # fail rather than skip.
          pip install pyahocorasick

      - name: Lint
        run: ruff check pipeline/ .claude/skills/ --select F

      - name: Run tests
        run: |
          python -m pytest pipeline/ \
            .claude/skills/sim2real-analyze/tests/ \
            .claude/skills/sim2real-bootstrap/tests/ \
            .claude/skills/sim2real-specify/tests/ \
            .claude/skills/sim2real-translate/tests/ \
            .claude/skills/sim2real-check/tests/ \
            --cov=pipeline \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            -v
