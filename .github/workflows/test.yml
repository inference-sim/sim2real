name: Transfer Pipeline Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          submodules: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest pytest-cov ruff -r requirements.txt

      - name: Lint
        run: ruff check pipeline/ .claude/skills/ --select F

      - name: Run tests
        run: |
          python -m pytest pipeline/ \
            .claude/skills/sim2real-analyze/tests/ \
            .claude/skills/sim2real-bootstrap/tests/ \
            .claude/skills/sim2real-translate/tests/ \
            .claude/skills/sim2real-check/tests/ \
            --cov=pipeline \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            -v
