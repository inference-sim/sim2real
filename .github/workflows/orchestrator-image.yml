name: Build Orchestrator Image

on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/orchestrator-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: inference-sim/sim2real/orchestrator

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    permissions:
      contents: read
      packages: write
      issues: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (load for smoke test)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} --help
          docker run --rm --entrypoint kubectl ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} version --client
          docker run --rm --entrypoint helm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} version --short
          docker run --rm --entrypoint python ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -c "
          import pkgutil, importlib, pipeline.lib as p
          failures = []
          for m in pkgutil.iter_modules(p.__path__):
              try:
                  importlib.import_module(f'pipeline.lib.{m.name}')
              except Exception as e:
                  failures.append(f'{m.name}: {type(e).__name__}: {e}')
          if failures:
              raise SystemExit(chr(10).join(failures))
          print('OK: all pipeline.lib modules imported')
          "

      # Push from buildkit rather than the docker daemon. A separate
      # `docker push` of the loaded image intermittently fails with
      # `unknown blob`: layers restored from the type=gha cache are
      # manifest-present but blob-absent in the daemon store (issue #661).
      # This step is a warm cache hit from the build above, so it rebuilds
      # nothing and streams the (guaranteed-present) blobs straight to ghcr.
      - name: Push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Notify on failure
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          script: |
            const labels = ['ci-broken', 'orchestrator-image'];
            const colors = { 'ci-broken': 'd93f0b', 'orchestrator-image': 'c5def5' };

            // Idempotent label creation: 422 = already exists, anything else propagates.
            for (const name of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color: colors[name],
                });
              } catch (e) {
                if (e.status !== 422) throw e;
              }
            }

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: labels.join(','),
            });

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Run [${context.runId}](${runUrl}) failed on \`${context.sha.slice(0, 7)}\`.`;

            if (existing.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'CI: Build Orchestrator Image is failing on main',
                body,
                labels,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            }
